<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>名詞判定</title>
  <style>
    :root {font-family:system-ui,"Yu Gothic UI",sans-serif;color:#23362c;background:#f4f6f3;color-scheme:light}
    *{box-sizing:border-box} body{margin:0} main{max-width:1320px;margin:auto;padding:28px 24px 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
    h1{font-size:22px;margin:0;font-weight:650} a{color:#326344;text-underline-offset:4px}
    .card{background:white;border:1px solid #dce3dc;border-radius:16px;overflow:hidden;box-shadow:0 4px 22px #24392d05}
    .controls{padding:28px;border-bottom:1px solid #e4e9e3}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .badge{font-size:12px;color:#596d5e;background:#f0f5ef;border-radius:20px;padding:6px 12px}
    label{display:block;font-size:13px;margin-bottom:8px;color:#536559}
    .question{display:flex;align-items:center;gap:12px;font-size:clamp(20px,3vw,28px);margin:20px 0 24px;flex-wrap:wrap}
    input,select{font:inherit;color:inherit;background:#fff;border:1px solid #cbd8cd;border-radius:8px;padding:10px 12px;min-width:0}
    input:focus{outline:3px solid #99bd9940;border-color:#579369} #target{font-weight:600;width:240px;font-size:24px}
    .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}button{font:inherit;font-weight:600;border:1px solid #cbd8cd;border-radius:9px;padding:11px 18px;cursor:pointer;background:white;color:#31533d}
    button.primary{background:#306643;color:white;border-color:#306643} button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}
    #progress{font-size:13px;color:#637165;margin-left:auto} #error{color:#9b2929;margin:16px 0 0} .hidden{display:none!important}
    .tablewrap{overflow-x:auto}table{width:100%;min-width:1080px;border-collapse:collapse;text-align:left}th{font-size:12px;font-weight:500;color:#66766a;background:#fafcf9;padding:14px 14px;white-space:nowrap}
    td{padding:12px 14px;border-top:1px solid #edf0eb;font-size:14px}th:first-child,td:first-child{width:60px;white-space:nowrap;padding-right:12px}td:first-child{color:#8b978e}td:nth-child(2){width:155px;min-width:155px}td input{width:100%;max-width:230px;font-size:15px}
    .probability{display:flex;align-items:center;gap:14px;min-width:180px}.track{height:8px;flex:1;background:#edf2ec;border-radius:10px;overflow:hidden}.fill{height:100%;background:#56956b;width:0;transition:width .2s}
    .percent{width:62px;text-align:right;font-variant-numeric:tabular-nums}.answer{min-width:230px;color:#78867a;overflow-wrap:anywhere}.answer.yes{color:#23723d;font-weight:600}.answer.no{color:#b33131;font-weight:600}
    .feedback{min-width:185px}.feedback-buttons{display:flex;gap:6px}.feedback button{font-size:12px;padding:7px 9px;white-space:nowrap}.feedback button[aria-pressed="true"]{background:#e0eadd;border-color:#52784c}.feedback-status{font-size:11px;color:#66766a;display:block;margin-top:5px}header nav{display:flex;gap:20px;align-items:center}#download-feedback{font-size:12px;padding:8px 12px}
    footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#758175}.auth{margin-top:16px}#key{font-size:14px;width:260px}
    .model-line{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.model-line label{margin:0}.stats{display:flex;gap:22px;flex-wrap:wrap;padding:18px 28px;background:#f8fbf7;border-bottom:1px solid #dce3dc;font-size:12px;color:#66766a}.stats strong{display:block;font-size:19px;color:#294936;margin-top:4px;font-variant-numeric:tabular-nums}.stats button{margin-left:auto;font-size:12px;padding:7px 10px}.timing{white-space:nowrap;font-variant-numeric:tabular-nums;color:#526857}
    @media(max-width:600px){main{padding:18px 10px}.controls{padding:20px}td,th{padding:12px 10px}.probability{min-width:130px}#target{width:180px}#progress{margin-left:0;width:100%}}
  </style>
</head>
<body>
<main>
  <header><h1>名詞判定</h1><nav><button id="download-feedback">記録をダウンロード</button><a href="/">サンプル一覧</a></nav></header>
  <section class="card">
    <div class="controls">
      <div class="model-line"><label for="model-select">モデル</label><select id="model-select" disabled><option value="qwen-0.8b">Qwen 0.8B</option><option value="qwen-2b">Qwen 2B</option><option value="gemma-e2b">Gemma E2B</option></select></div>
      <div class="topline"><label for="target">質問する名詞</label><span class="badge" id="word-count">読み込み中</span></div>
      <div class="question"><span>これは</span><select id="target" disabled><option value="動物">動物</option></select><span>ですか？</span></div>
      <datalist id="noun-list"></datalist>
      <div class="actions"><button class="primary" id="random" disabled>ランダム生成</button><button id="evaluate" disabled>評価する</button><button id="cancel" class="hidden">中止</button><span id="progress" role="status" aria-live="polite">準備中</span></div>
      <div id="auth" class="auth hidden"><label for="key">APIキー</label><input id="key" type="password" autocomplete="off"></div>
      <p id="error" role="alert" class="hidden"></p>
    </div>
    <div class="stats" aria-live="polite"><div>生成回数<strong id="runs">0回</strong></div><div>累積件数<strong id="count">0件</strong></div><div>平均応答時間<strong id="average-time">—</strong></div><div>平均「はい」確率<strong id="average-probability">—</strong></div><button id="reset" disabled>集計をリセット</button></div>
    <div class="tablewrap"><table><thead><tr><th>順位</th><th>候補の名詞</th><th>はいの確率</th><th>判定結果</th><th>応答時間 ↑</th><th>フィードバック</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <footer><span id="model">接続中</span><span id="total"></span></footer>
</main>
<script src="/assets/nouns-core.js"></script><script src="/assets/nouns.js"></script>
</body>
</html>
