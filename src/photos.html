<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev互換ローカル画像判定</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#23362c;font:14px system-ui,"Yu Gothic UI",sans-serif}main{max-width:1120px;padding:12px 16px;margin:auto}header,.controls,nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:12px}h1{font-size:22px;margin:0}a{color:#326344}.card{border:1px solid #dce3dc;border-radius:12px;background:white;padding:12px}.controls{margin-bottom:12px}button,select,input{font:inherit;color:inherit}button,select{border:1px solid #cbd8cd;border-radius:7px;background:white;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}#file{max-width:100%;width:275px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.preview{min-height:260px;background:#f5f7f4;border-radius:8px;display:grid;place-items:center;overflow:hidden}#preview{display:block;max-width:100%;max-height:65vh;object-fit:contain}.hidden{display:none!important}#status{font-size:12px;color:#657468}#error{color:#b33131}#summary{font-size:20px;margin:10px 0 16px}.result{padding:12px 0;border-top:1px solid #e4e9e3}.result h2{font-size:16px;margin:0 0 8px}.answer{font-size:18px}.yes{color:#23723d}.no{color:#b33131}.meter{display:flex;gap:10px;align-items:center;margin-top:8px}.track{height:9px;flex:1;background:#e3e7e2;position:relative;border-radius:5px;overflow:hidden}.track:after{content:"";position:absolute;left:50%;height:100%;top:0;border-left:1px solid #647268}.fill{height:100%;background:currentColor;width:0}.note{font-size:12px;color:#657468;margin-top:12px}#auth{margin-top:8px}#key{width:220px}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding:8px}.preview{min-height:160px}}
</style></head><body><main><header><h1>Jev互換ローカル画像判定</h1><nav><a href="/nouns">名詞判定</a><a href="/battle">モデル対戦</a></nav></header>
<section class="card"><div class="controls"><label>モデル <select id="model"><option value="qwen-2b">Qwen 2B</option><option value="qwen-0.8b">Qwen 0.8B</option></select></label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="判定する画像"><button id="evaluate" disabled>再判定</button><span id="status" role="status">画像を選んでください</span></div><div id="auth" class="hidden"><label>APIキー <input id="key" type="password" autocomplete="off"></label></div><p id="error" role="alert"></p>
<div class="layout"><div class="preview"><span id="placeholder">JPEG・PNG・WebP（8MBまで）</span><img id="preview" class="hidden" alt="判定する画像"></div><div><p id="summary">未判定</p><section class="result" id="text-result"><h2>文字情報を含む写真</h2><div class="answer">—</div><div class="meter"><span class="percent">—</span><div class="track"><div class="fill"></div></div></div></section><section class="result" id="landscape-result"><h2>風景の写真</h2><div class="answer">—</div><div class="meter"><span class="percent">—</span><div class="track"><div class="fill"></div></div></div></section><p class="note" id="timing"></p></div></div>
<p class="note">画像選択で自動判定します。文字入りの風景は両方に該当します。画像はローカルで処理し、保存・外部送信しません。</p></section></main><script src="/assets/photos.js"></script></body></html>
