<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jev互換ローカルモデル 問い合わせ速度比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#23362c;font:14px system-ui,"Yu Gothic UI",sans-serif}main{max-width:1400px;margin:auto;padding:10px 16px}header,.controls,.toolbar,.dialog-heading{display:flex;align-items:center;gap:9px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:10px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}a{color:#326344}nav{display:flex;gap:14px}button,input,select{font:inherit;border:1px solid #cbd8cd;border-radius:7px;background:white;color:inherit;padding:6px 9px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#306643;color:white}.card{background:white;border:1px solid #dce3dc;border-radius:10px;overflow:hidden;margin-bottom:10px}.controls,.toolbar{padding:9px 12px}.toolbar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}.toolbar>*{flex-shrink:0}.hidden{display:none!important}#target{width:160px}#progress{font-size:12px;margin-left:auto}#error,#save-status.error{color:#b33131}#error:empty{display:none}#error{margin:8px 12px}#candidate-editors{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;max-height:220px;overflow:auto}.candidate{display:flex;align-items:center;gap:4px}.candidate>span{font-size:11px;width:24px;color:#657468}.candidate input{width:125px}.model-slots label{display:inline-flex;gap:5px;align-items:center}.model-slots{padding-top:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:7px 10px;border-top:1px solid #e4e9e3;vertical-align:top}th{background:#f8fbf7;font-size:12px;font-weight:500}td{font-size:13px}.number{font-variant-numeric:tabular-nums;white-space:nowrap}.sub{font-size:12px;color:#657468;margin-top:3px}.yes{color:#23723d}.no{color:#b33131}.faster{font-weight:650;color:#23723d}#result-title{font-size:15px;padding:10px 12px;margin:0}#auth{padding:0 12px 10px}#key{width:180px}dialog{width:calc(100vw - 24px);height:calc(100vh - 24px);max-width:none;max-height:none;margin:auto;padding:14px;border:1px solid #9aae9d;border-radius:12px;color:inherit;background:#f4f6f3}dialog::backdrop{background:#23362c66}.dialog-heading{margin-bottom:12px}.dialog-heading button{margin-left:auto}#detail-content{background:white;padding:8px;overflow:auto;max-height:calc(100% - 48px)}#detail-content pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.wait-panel{position:fixed;z-index:1000;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:12px;width:min(340px,calc(100vw - 32px));padding:24px;background:#fffffff5;border:1px solid #cbd8cd;border-radius:16px;box-shadow:0 10px 40px #23362c30;text-align:center;pointer-events:none}.spinner{width:46px;height:46px;border:5px solid #dce8de;border-top-color:#306643;border-radius:50%;animation:spin .85s linear infinite}#elapsed{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}#wait-progress{font-size:13px}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:650px){main{padding:8px}.controls{gap:7px}#progress{margin-left:0}.model-slots select{max-width:160px}}
</style></head><body>
<div id="comparison-wait" class="wait-panel hidden" aria-label="比較を実行中"><div class="spinner" aria-hidden="true"></div><strong role="status">比較中</strong><span id="elapsed" role="timer" aria-live="off">0秒</span><span id="wait-progress" aria-hidden="true"></span></div>
<main><header><h1>Jev互換ローカルモデル 問い合わせ速度比較</h1><nav><a href="/">トップページ</a><a href="/battle">モデル対戦</a><a href="/nouns">名詞判定</a></nav></header>
<section class="card"><div class="controls"><span>これは</span><div><input id="target" maxlength="80" value="動物" aria-label="質問する名詞"></div><span>ですか？</span><label>件数 <select id="candidate-count"><option value="1">1件</option><option value="10" selected>10件</option><option value="30">30件</option><option value="100">100件</option></select></label><button id="random" class="primary" disabled>ランダムに変更</button><button id="start" class="primary" disabled>比較する</button><button id="stop" class="hidden">中止</button><span id="progress" role="status">準備中</span></div>
<div id="model-slots" class="controls model-slots"></div><div id="auth" class="hidden"><label>APIキー <input id="key" type="password" autocomplete="off"></label></div><p id="error" role="alert"></p><div id="candidate-editors"></div></section>
<section class="card"><div class="toolbar"><button id="download" disabled>結果をダウンロード</button><button id="retry-save" disabled>保存を再試行</button><span id="save-status" role="status"></span><button id="current-result" disabled>今回の結果</button><button id="refresh-history">保存履歴</button><select id="history-select" aria-label="保存した比較" disabled><option value="">保存履歴を選択</option></select><button id="more-history" disabled>以前の結果</button><span id="history-status" role="status"></span></div>
<h2 id="result-title">未計測</h2><div class="tablewrap"><table><thead><tr><th>モデル</th><th title="最初の問い合わせ送信から最後の応答受信まで。モデル読込・予備判定を除きます。">個別合計</th><th title="一括問い合わせ送信から全応答受信まで。モデル読込・予備判定を除きます。">一括合計</th><th>短縮率</th><th>倍率</th><th>判定一致</th><th>状態</th><th>結果</th></tr></thead><tbody id="comparison-results"></tbody></table></div></section>
</main><dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title">比較結果</h2><button id="close-detail">閉じる</button></div><div id="detail-content"></div></dialog>
<script src="/assets/noun-combo.js"></script><script src="/assets/nouns-core.js"></script><script src="/assets/battle-core.js"></script><script src="/assets/query-comparison-core.js"></script><script src="/assets/query-comparison.js"></script></body></html>
