<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モデル対戦</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f3;color:#23362c;font:14px system-ui,"Yu Gothic UI",sans-serif}main{max-width:1400px;margin:auto;padding:10px 16px}header,.controls,.summary,.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;margin-bottom:10px}h1{font-size:22px;margin:0}a{color:#326344}nav{display:flex;gap:16px}button,input,select{font:inherit;border:1px solid #cbd8cd;border-radius:7px;background:white;color:inherit;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#306643;color:white}.card{background:white;border:1px solid #dce3dc;border-radius:12px;overflow:hidden}.controls,.toolbar{padding:10px 12px}.controls input{width:160px}.hidden{display:none!important}#progress{margin-left:auto;font-size:12px}#error{color:#b33131;margin:8px 12px}.summary{align-items:stretch;display:grid;grid-template-columns:repeat(3,1fr);padding:0 12px 10px;gap:10px}.model-card{background:#f5f9f4;border:1px solid #dce3dc;border-radius:8px;padding:10px}.model-card h2{font-size:16px;margin:0 0 6px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px}.metrics strong{display:block;font-size:17px;font-variant-numeric:tabular-nums}.sub{font-size:12px;color:#657468;margin-top:6px}.tablewrap{overflow:auto}table{width:100%;min-width:960px;border-collapse:collapse}th,td{text-align:left;padding:6px 10px;border-top:1px solid #e4e9e3}th{font-size:12px;background:#f8fbf7;font-weight:500}td{font-size:13px;vertical-align:top}td input{width:130px;padding:5px 8px}.yes{color:#23723d}.no{color:#b33131}.result{overflow-wrap:anywhere}.fast{font-weight:700}.mismatch{background:#fff8e8}.toolbar{font-size:12px;background:#f8fbf7}.toolbar button{margin-left:auto}#key{width:180px}details{font-size:12px;color:#657468;margin:10px 0}#auth{padding:0 12px 10px}@media(max-width:650px){main{padding:8px}.summary{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(4,1fr)}#progress{margin-left:0}.controls{gap:8px}}
</style></head><body><main>
<header><h1>モデル対戦</h1><nav><button id="export" disabled>結果をダウンロード</button><a href="/nouns">名詞判定</a></nav></header>
<section class="card">
<div class="controls"><span>これは</span><input id="target" list="targets" value="動物" maxlength="80" aria-label="質問する名詞"><span>ですか？</span><button id="random" class="primary" disabled>ランダム対戦</button><button id="start" disabled>対戦する</button><button id="stop" class="hidden">中止</button><span id="progress" role="status">準備中</span></div>
<datalist id="targets"></datalist><datalist id="nouns"></datalist>
<div id="auth" class="hidden"><label>APIキー <input id="key" type="password" autocomplete="off"></label></div><p id="error" role="alert"></p>
<div class="summary" id="summary"></div>
<div class="toolbar"><span id="agreement">判定一致 —</span><span id="cumulative">累積 0回</span><label>並び順 <select id="sort"><option value="original">元の順</option><option value="name">名前順</option><option value="difference">判定が割れた順</option></select></label><button id="reset">集計をリセット</button></div>
<div class="tablewrap"><table><thead><tr><th>候補</th><th>Qwen 0.8B</th><th>Qwen 2B</th><th>Gemma E2B</th><th>最速</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
<details><summary>計測について</summary>同じ10件を1モデルずつ評価します。各モデルで予備判定を1回行い、速度集計から除外します。表示時間はAPI送信から応答受信までです。モデル切り替え時間は別表示です。全30件が成功した対戦のみ累積へ加算し、累積値はこのブラウザーに保存します。判定一致は正解率ではありません。中止は処理中の1件が終了してから行い、終了時は元のモデルへ戻します。</details>
</main><script src="/assets/nouns-core.js"></script><script src="/assets/battle-core.js"></script><script src="/assets/battle.js"></script></body></html>
